name: magic_games
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  dio: ^5.9.2
  gap: ^3.0.1
  webview_flutter: ^4.14.0
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  google_mobile_ads: ^9.0.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^3.1.0
  flutter_svg: ^2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.7.0

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/png/
    - assets/svg/

  fonts:
    - family: lato
      fonts:
        - asset: assets/fonts/Lato-Black.ttf
        - asset: assets/fonts/Lato-Bold.ttf
        - asset: assets/fonts/Lato-Light.ttf
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato_Semibold.ttf
        - asset: assets/fonts/Lato-thin.ttf
