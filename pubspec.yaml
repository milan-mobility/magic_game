name: magic_games
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  dio: ^5.9.2
  gap: ^3.0.1
  webview_flutter: ^4.14.0
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  google_mobile_ads: ^9.0.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^3.1.0
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  version: ^3.0.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  os_detect: ^2.0.3
  in_app_review: ^2.0.11
  flutter_native_splash: ^2.4.7
  firebase_remote_config: ^6.5.3
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.1.0
  firebase_crashlytics: ^5.2.4
  firebase_core: ^4.11.0
  firebase_analytics: ^12.0.2
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  flutter_new_badger: ^1.1.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  device_info_plus: ^11.5.0
  package_info_plus: ^8.1.3
  share_plus: ^11.1.0
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  games_services: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.7.0
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/png/
    - assets/png/profile_pic/
    - assets/svg/

  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Thin.ttf


flutter_native_splash:
  color: "#040021"
  image: "assets/png/ic_splash_logo.png"
  android: true
  ios: true

  android_12:
    image: "assets/png/ic_splash_12.png"
    color: "#040021"
  web: false
